# Контекстные проверки по тексту всей колоды, без картинок.
#
# Сюда вынесены вопросы, где картинка не добавляет ничего: опечатки, единство
# языка, происхождение чисел, связность соседних слайдов. Они не зависят от
# варианта вёрстки — содержание у трёх вариантов одно, — поэтому задаются раз
# на колоду, а не трижды с картинкой.
name: audit_deck
version: "1"
step: audit_deck
description: >
  Отвечает «да/нет» на контекстные вопросы Приложения 1, которые решаются по
  тексту колоды: опечатки, единый язык, происхождение чисел, связность.
template: |
  Перед тобой текст деловой презентации целиком.

  Тема: {topic}
  Язык, на котором колода должна быть написана: {language}

  Слайды:
  {slides}

  Числа, которые колода утверждает, и их происхождение:
  {figures}

  Ответь на каждый вопрос строго «да» или «нет».

  {questions}

  Правила ответа:
  - «нет» ставь только тогда, когда можешь показать, где именно проблема.
  - в `reason` называй слайд и конкретное место.
  - `slide_index` — номер слайда, к которому относится ответ; 0, если ко всей
    колоде.
  - `confidence` от 0 до 1.

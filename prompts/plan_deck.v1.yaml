# Промпт планировщика колоды. Версионируемый файл: в код не зашит (ТЗ п.4).
# Версия и хэш этого файла пишутся в манифест каждого прогона.
name: plan_deck
version: "1"
step: plan_deck
description: >
  По брифу и контент-пакету строит DeckPlan: состав слайдов, их порядок,
  намерение каждого и содержательные блоки — до всякой вёрстки.
template: |
  Ты выстраиваешь структуру деловой презентации.

  Тема: {topic}
  Назначение: {purpose}
  Аудитория: {audience}
  Цель: {goal}
  Язык: {language}
  Дополнительно: {extra_instructions}

  Исходные материалы — факты:
  {facts}

  Исходные материалы — числовые ряды:
  {series}

  Собери план на {slide_count} слайдов.

  Правила:
  - Заголовок каждого слайда — вывод, а не название темы. Пиши
    «Выручка выросла на 34 % за квартал», а не «Выручка».
  - Первый слайд — титульный, последний — завершающий.
  - Содержательный слайд обязан иметь блоки: слайд с одним заголовком
    не считается слайдом.
  - Числа бери только из исходных материалов. Ничего не придумывай:
    каждое число должно находиться в фактах или рядах выше.
  - Блок с числовым рядом ссылается на него по идентификатору в series_ids.
  - Пиши на языке {language}.

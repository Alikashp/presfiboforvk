# Контекстные проверки по картинке слайда. Вопросы — из Приложения 1 ТЗ.
#
# Почему по картинке, а не по тексту SlideIR: текст показывает намерение, а не
# результат. Обрезанный краем слайда абзац, наложившиеся блоки, приехавшая от
# чужого слайда иконка — ничего из этого в тексте не видно вовсе. Колода,
# проверенная только по тексту, не проверена.
#
# Разрешение картинки задаётся в конфиге (audit.contextual_dpi): токены растут
# как площадь, и 150 dpi стоит вчетверо дороже 72 при том же ответе.
name: audit_slide
version: "1"
step: audit_slide
description: >
  Отвечает «да/нет» на контекстные вопросы Приложения 1 по картинке одного
  слайда. Каждый ответ сопровождается коротким объяснением и уверенностью.
template: |
  Перед тобой картинка одного слайда деловой презентации.

  Заголовок слайда: {title}
  Намерение слайда: {intent}
  Текст слайда, как его задумала вёрстка:
  {body}

  Ответь на каждый вопрос строго «да» или «нет», глядя на картинку.

  {questions}

  Правила ответа:
  - «нет» ставь только тогда, когда видишь проблему на картинке. Сомнение —
    это «да» с низкой уверенностью, а не «нет».
  - в `reason` пиши, что именно видно, а не пересказывай вопрос.
  - `confidence` от 0 до 1: насколько ты уверен в своём ответе.
  - отвечай только про этот слайд, не про колоду.

# Промпт планировщика. Версия 7.
#
# Что изменилось против v6: форма данных и люди. Живые планы питча Fibonacci
# (сентябрь 2026) клали TAM/SAM/SOM, метрики и юнит-экономику в один блок kpi
# с заголовком «Объём рынка» и строками цифр: число показателя — `heading`,
# и в место крупного числа садился заголовок. Слайд «Команда» писался общими
# словами, хотя люди с ролями были в материалах. Отсюда:
# - блок kpi — одно число; несколько чисел — несколько блоков kpi;
# - у каждого числового блока — fact_ids (форму по ним проверяет код);
# - люди, этапы, сравнения из фактов — на слайды, а не общие слова.
#
# v6: ответ короче — пример компактного слайда, JSON без отступов, `kind` у
# процитированного числа не пишется.
#
# v5: вход не только контент-пакет датасета; число слайдов выбирает модель в
# границах ТЗ; без фактов с числами — без чисел на слайдах.
name: plan_deck
version: "7"
step: plan_deck
description: >
  По брифу и контент-пакету строит DeckPlan: состав слайдов, их порядок,
  намерение каждого и содержательные блоки — до всякой вёрстки. Соблюдает
  ограничения длины, снятые с шаблона, и пороги плотности из ТЗ.
template: |
  Ты выстраиваешь структуру деловой презентации.

  Тема: {topic}
  Назначение: {purpose}
  Аудитория: {audience}
  Цель: {goal}
  Язык: {language}
  Дополнительно: {extra_instructions}

  Запрос пользователя его словами:
  {request}

  Исходные материалы — факты:
  {facts}

  Исходные материалы — числовые ряды:
  {series}

  Исходные материалы — цитаты:
  {quotes}

  Собери план на {slide_count} слайдов.

  ОГРАНИЧЕНИЯ ДЛИНЫ. Их задаёт шаблон, в который слайды будут свёрстаны;
  текст длиннее не поместится в рамку и будет обрезан:
  {length_limits}

  ПРАВИЛА СОДЕРЖАНИЯ:
  - Заголовок каждого слайда — вывод, а не название темы. Пиши
    «Выручка выросла на 34 % за квартал», а не «Выручка».
  - На слайде с данными (блоки series, kpi, table) заголовок называет
    изменение и его числа: «Время обнаружения сократилось с 42 до 9 минут»,
    а не «Динамика улучшения показателей». Эти числа объяви в figures.
  - Первый слайд — титульный, последний — завершающий.
  - Содержательный слайд обязан иметь блоки: слайд с одним заголовком
    не считается слайдом.
  - Люди, этапы, конкуренты и сравнения из фактов идут на слайды как есть:
    слайд о команде — пункт на человека «имя — роль, опыт», слайд о пути —
    пункт на этап. Общие слова вместо фактов («опытная команда») не пиши.
  - Пиши на языке {language}.

  ПРАВИЛА ПОКАЗАТЕЛЕЙ. Блок kind "kpi" — одно число: heading — само число
  с единицей («160 млрд ₽»), items — одна короткая подпись («мировой рынок,
  TAM»), fact_ids — факт этого числа. Два–четыре числа одного слайда — это
  два–четыре блока kpi, а не один блок со строками. Название группы чисел
  («Объём рынка») пиши в subtitle слайда, не в heading. Доли одного целого
  (30 % и 70 %) и ряды из пяти и больше однородных чисел — блок series по
  ряду или блок с fact_ids этих чисел. У каждого блока с числами — fact_ids.

  ПРАВИЛА ЧИСЕЛ. Каждое число, вынесенное на слайд, перечисли в поле figures
  этого слайда с указанием происхождения:
  - число взято из материалов как есть — укажи fact_ids, kind не пиши
    (по умолчанию "cited").
  - kind "derived" — число выведено из материалов; укажи fact_ids и formula,
    выражение над идентификаторами фактов: например "f1 / f3".
    В формуле допустимы только идентификаторы фактов, числа и знаки + - * /.
  Числа, которых нет в материалах и которые из них не выводятся, не пиши
  вовсе. Это касается и заголовков: «сократилось в 4.6 раза» — выведенное
  число, и оно тоже объявляется в figures.

  ЕСЛИ МАТЕРИАЛОВ МАЛО. Когда фактов немного или это только бриф, строй
  содержание из брифа и общих знаний о предмете: проблема, решение, как это
  работает, польза для аудитории, шаги внедрения, призыв к действию. Но
  никаких чисел, процентов, сроков, сумм, дат, имён, названий клиентов и
  цитат, которых нет в материалах: такие слайды пишутся словами. Заголовок-
  вывод без чисел — «Протокол встречи готов сразу после созвона», а не
  «Протокол готов за 5 минут».

  ЦИТАТЫ. Блок kind "quote" ссылается на цитату по идентификатору в
  quote_id; текст цитаты не переписывай.

  ПРАВИЛА ТАБЛИЦ. Блок kind "table" обязан нести объект table с полями
  columns и rows; rows — список списков ячеек по числу колонок. Не складывай
  таблицу в items строками с разделителями.

  ПРАВИЛА ДАННЫХ. Блок kind "series" ссылается на числовой ряд по
  идентификатору в series_ids.

  ФОРМАТ ОТВЕТА. JSON одной строкой, без отступов и переносов. Не выводи
  поля с пустым значением: пустые списки [], null и пустые строки ""
  опускай целиком — они подставятся сами. Каждый лишний символ ответа —
  секунды ожидания. Так выглядят слайды в ответе — ничего лишнего
  (идентификаторы здесь условные, бери свои из материалов):
  {{"index":4,"intent":"evidence","takeaway_title":"Время ответа сократилось с 26 до 9 часов","blocks":[{{"id":"b4","kind":"series","series_ids":["s1"]}}],"figures":[{{"text":"26","fact_ids":["f3"]}},{{"text":"9","fact_ids":["f4"]}}]}}
  {{"index":5,"intent":"evidence","takeaway_title":"Рынок — 160 млрд ₽, наша доля растёт","subtitle":"Объём рынка","blocks":[{{"id":"b5","kind":"kpi","heading":"160 млрд ₽","items":["мировой рынок, TAM"],"fact_ids":["f10"]}},{{"id":"b6","kind":"kpi","heading":"630 млн ₽","items":["Россия, SAM"],"fact_ids":["f11"]}}],"figures":[{{"text":"160 млрд ₽","fact_ids":["f10"]}},{{"text":"630 млн ₽","fact_ids":["f11"]}}]}}

# Промпт приведения входа к контент-пакету. Версия 3.
#
# v3: факты — не только числа. На питче Fibonacci (сентябрь 2026) лимит в 20
# фактов модель целиком отдала утверждениям с цифрами: команды (четыре
# человека с ролями и опытом), конкурентов, этапов пути в пакете не было, и
# слайд «Команда» вышел без людей. Теперь люди, роли, названия, этапы и
# сравнения прямо названы фактами, и материал покрывается по разделам.
#
# v2: у ряда — `shape` (динамика, доли, сравнение). По числам их не
# отличить: помесячная выручка в сумме тоже даёт квартальную, а рисовать её
# кольцом долей — ошибка. Вид графика выбирает вёрстка по этому полю.
#
# Вход — любой: короткий бриф, длинный документ, таблица, JSON чужой
# структуры. Код уже прочитал файлы и показывает их текст фрагментами с
# местом в документе. Модель выбирает из них тему, факты, ряды и цитаты.
# Числа потом сверяются с текстом входа кодом: выдуманное число
# отбрасывается вместе с фактом, поэтому переписывать числа запрещено.
name: ingest_content
version: "3"
step: ingest_content
description: >
  По тексту входа (бриф и/или документы) извлекает тему презентации,
  назначение, аудиторию, цель, факты — с числами и без, — числовые ряды и
  цитаты с указанием документа и места в нём.
template: |
  Ты готовишь материалы для деловой презентации. Ниже — всё, что прислал
  пользователь: бриф и/или документы. Каждый документ помечен
  идентификатором в квадратных скобках, каждый фрагмент — местом в документе
  в круглых скобках.

  Назначение, выбранное пользователем: {purpose}

  {documents}

  ЗАДАЧА. Извлеки:
  - topic — тема презентации одной фразой, не длиннее 80 символов;
  - purpose — назначение: feature (фича), product (продукт), project (проект)
    или initiative (инициатива). Если пользователь его выбрал, повтори его;
  - audience и goal — для кого презентация и чего она добивается, если это
    сказано или ясно из материалов;
  - language — язык материалов, двухбуквенный код;
  - facts — самые важные утверждения материалов, не больше {max_facts}.
    Факт — одна мысль одним коротким предложением. Факт без числа — такой же
    факт, как с числом: люди с ролью и опытом («Максим Исаев — CTO, 5+ лет
    в IT»), названия продуктов, конкурентов и партнёров, этапы и вехи пути,
    преимущества, условия, шаги. Каждый раздел, страница или слайд
    материалов, где есть содержание, дают хотя бы один факт. Не трать все
    факты на числа: если в материалах есть люди, этапы или сравнение — они
    обязаны попасть в факты. Если в факте есть число, вынеси его в value
    (числом, без единиц) и unit;
  - series — числовые ряды из таблиц и перечислений: одна величина по
    категориям или по времени, минимум две точки. Подписи точек — как в
    источнике, значения — сами величины, а не годы и не номера. shape ряда:
    time — динамика во времени или по этапам по порядку (месяцы, кварталы,
    годы); parts — доли одного целого (каналы, сегменты, структура выручки),
    их сумма — это целое; compare — сравнение независимых категорий (города,
    продукты, команды);
  - quotes — прямые цитаты людей, если они есть, дословно.

  ПРАВИЛА ЧИСЕЛ:
  - Бери только числа, которые написаны во входе. Не считай новых, не
    округляй, не переводи единицы. Не придумывай числа, проценты, даты,
    суммы, названия клиентов и имена.
  - Число относи к тому, к чему оно относится во входе: цель на будущий год
    — целью, а не достигнутым результатом прошлого.
  - Если во входе чисел нет, факты будут без value — это нормально.
  - Если вход — короткий бриф, факты — утверждения брифа, без добавлений.

  ПРАВИЛА ССЫЛОК. doc_id каждого факта, ряда и цитаты — идентификатор
  документа из квадратных скобок, где это написано; locator — место из
  круглых скобок.

  ФОРМАТ ОТВЕТА. Не выводи поля с пустым значением: пустые списки [],
  null и пустые строки "" опускай целиком.

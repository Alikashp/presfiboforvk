# Переписывание текста одного слайда по находке аудита.
#
# Шаг выполняется ТОЛЬКО по явному выбору человека: находки «сократить» и
# «разнести пункты» помечены ASSISTED, потому что решать, что выкинуть,
# значит решать за автора.
#
# Рамки те же, что у планировщика, и это не вежливость, а условие сходимости
# цикла: текст, переписанный без ограничений длины, снова не влезет в рамку, и
# следующая итерация принесёт ту же находку. Новых чисел модель вводить не
# может — происхождение фактов проверяется детерминированно и обязано
# сохраниться.
name: rewrite_slide
version: "1"
step: shorten_text
description: >
  Сокращает или разносит текст одного слайда по выбранной находке аудита,
  не выходя за ограничения длины шаблона и не вводя чисел, которых на слайде
  не было.
template: |
  Перед тобой текст одного слайда деловой презентации. Его нужно переписать
  по замечанию редактора, ничего не добавляя от себя.

  Язык: {language}
  Заголовок слайда: {title}
  Назначение слайда: {intent}

  Блоки слайда:
  {blocks}

  Замечания, которые нужно устранить:
  {findings}

  ОГРАНИЧЕНИЯ ДЛИНЫ. Их задаёт шаблон, в который слайд будет свёрстан;
  текст длиннее не поместится в рамку и будет обрезан:
  {length_limits}

  Правила переписывания:
  - Смысл сохраняется. Убирай слова, а не утверждения.
  - Новых чисел не вводи: ни процентов, ни сумм, ни сроков, которых в этом
    тексте нет. Числа, которые уже есть, оставляй как они написаны.
  - Не добавляй блоков и не меняй их идентификаторы. Возвращай только те
    блоки, текст которых меняешь.
  - Заголовок остаётся выводом, а не названием темы.
  - Если замечание про число пунктов, объединяй близкие пункты, а не
    выбрасывай содержание.

  Верни заголовок и изменённые блоки.

# Единая точка воспроизводимого запуска.
# Секреты сюда не пишутся: ${VAR} подставляется из окружения (.env).

run:
  seed: 20260101
  # Каталог артефактов прогона. Внутри создаётся подкаталог по run_id.
  output_dir: outputs
  # Бюджет времени на колоду, секунды (ТЗ: не более 5 минут).
  time_budget_seconds: 300
  # Сколько слайдов собирать параллельно.
  slide_workers: 4
  # Предел итераций цикла «аудит → исправление → пересборка».
  # Находка, пережившая предел, остаётся в отчёте и попадает в manifest.unresolved:
  # честнее назвать её, чем крутить цикл дальше вслепую.
  max_fix_iterations: 2
  # Что прогон делает с находками сам: review (остановиться с отчётом для
  # выбора — умолчание ТЗ), auto (применить автоматические и пересобрать),
  # off (не трогать). ASSISTED и контекстные не применяются ни в одном
  # режиме — только по явному выбору пользователя в UI.
  fix_mode: review
  # Переписывать ли моделью выбранные текстовые ASSISTED-находки («сократить»,
  # «разнести пункты»). Выключено: без флага выбранная находка остаётся
  # помеченной «требует редактирования», а прогон не ходит в модель.
  rewrite_assisted: false

template:
  # Кэш разобранного TemplateSpec, ключ — хэш файла шаблона.
  cache_dir: .cache/templates

deck:
  # Целевое число слайдов. null = решает планировщик в границах min..max.
  slide_count: null
  min_slides: 10
  max_slides: 15
  language: ru
  # Назначение колоды: feature | product | project | initiative
  purpose: product

variants:
  # Три варианта вёрстки — один пайплайн, разные пресеты стратегии.
  - configs/variants/dense.yaml
  - configs/variants/balanced.yaml
  - configs/variants/airy.yaml

llm:
  base_url: ${LLM_BASE_URL}
  api_key:  ${LLM_API_KEY}
  model:    ${LLM_MODEL}
  timeout_seconds: 120
  max_retries: 3
  # Тарифы SiliconFlow за миллион токенов, USD.
  price_per_1m_input: 0.30
  price_per_1m_output: 3.20
  max_concurrent_calls: 8
  # Лимиты SiliconFlow, тариф L0. Узкое место — токены: тысячу запросов в
  # минуту мы не сделаем и близко, а сорок тысяч токенов полный прогон
  # выбирает за пару минут. Считать только одновременные вызовы недостаточно:
  # восемь параллельных запросов с картинкой слайда — это половина минутного
  # лимита одним всплеском. Ноль = не ограничивать (для своего инференса).
  tokens_per_minute: 40000
  requests_per_minute: 1000
  # Параметры по шагам пайплайна. Режим рассуждений по умолчанию выключен;
  # reasoning_effort уходит в запрос ТОЛЬКО если задан здесь явно.
  # Параметр, который endpoint не поддерживает, отбрасывается и не роняет прогон
  # (см. llm/client.py: отбрасывание по ответу 400 + запоминание на endpoint).
  steps:
    plan_deck:
      temperature: 0.4
      max_tokens: 6000
      enable_thinking: false
    # Переписывание текста слайда по выбранной находке аудита.
    shorten_text:
      temperature: 0.2
      max_tokens: 1000
      enable_thinking: false
    audit_deck:
      temperature: 0.0
      max_tokens: 1500
      enable_thinking: false

vlm:
  base_url: ${VLM_BASE_URL}
  api_key:  ${VLM_API_KEY}
  model:    ${VLM_MODEL}
  timeout_seconds: 120
  max_retries: 2
  price_per_1m_input: 0.30
  price_per_1m_output: 3.20
  # Контекстный аудит — вызов на слайд: 10 слайдов × 3 варианта = 30 вызовов.
  # По замеру планирования (34 с на вызов) последовательно это 300-900 с при
  # бюджете 300 с на колоду. Параллельность здесь не оптимизация, а условие
  # выполнимости требования ТЗ.
  max_concurrent_calls: 8
  # Лимит общий с LLM, если endpoint тот же: окно считается на аккаунт,
  # а не на модель.
  tokens_per_minute: 40000
  requests_per_minute: 1000
  # Имена шагов обязаны совпадать с теми, которыми код зовёт модель
  # (llm/base.py: STEPS). Параметры под другим именем не применяются вовсе,
  # поэтому конфиг с незнакомым шагом теперь не загружается.
  steps:
    audit_slide:
      temperature: 0.0
      max_tokens: 1500
      enable_thinking: false
    audit_deck:
      temperature: 0.0
      max_tokens: 1500
      enable_thinking: false

# Слот под text-to-image. Задача со звёздочкой: интерфейс заложен,
# реализация — после основного пайплайна.
image_provider:
  enabled: false
  base_url: ${T2I_BASE_URL}
  api_key:  ${T2I_API_KEY}
  model:    ${T2I_MODEL}

fonts:
  # Куда распаковываются встроенные в шаблон шрифты перед рендером.
  extract_dir: .cache/fonts
  # Если распаковать не удалось — подставить метрически близкий и записать
  # факт подстановки в манифест прогона и в находки аудита.
  allow_substitution: true
  # Запас на подстановку шрифта с ДРУГИМИ ширинами: бюджет длины ужимается
  # во столько раз. Метрически совместимый клон (Carlito вместо Calibri,
  # Liberation Sans вместо Arial) запаса не требует и его не получает —
  # у него те же ширины, и строки переносятся там же.
  substitution_slack: 0.8

render:
  soffice_binary: soffice
  soffice_timeout_seconds: 180
  png_dpi: 96

audit:
  contrast_min_ratio: 4.5
  max_bullets_per_slide: 6
  max_words_per_bullet: 15
  max_table_rows: 7
  max_table_cols: 5
  max_chart_series: 5
  min_fill_ratio: 0.25
  max_fill_ratio: 0.75
  # Контекстные проверки требуют VLM; без него выполняются только
  # детерминированные, и это отражается в отчёте.
  contextual_enabled: true
  # Разрешение картинки слайда для контекстного аудита. Токены растут как
  # площадь: 150 dpi вчетверо дороже 75. При 96 dpi слайд 16:9 обходится
  # примерно в 1180 токенов — этого хватает, чтобы разглядеть композицию.
  contextual_dpi: 96
  # Не переспрашивать модель про слайды, не изменившиеся после исправления.
  # Вторая итерация обычно трогает два-три слайда из тридцати.
  skip_unchanged_slides: true
  # Проверки, отвечаемые по тексту SlideIR, не зависят от варианта вёрстки:
  # содержание у трёх вариантов одно. Спрашивать их один раз на колоду, а не
  # трижды.
  text_checks_once_per_deck: true

  # Способ проверки для каждого контекстного вопроса Приложения 1 ТЗ.
  #
  #   image — вопрос идёт по картинке слайда, по одному разу на вариант;
  #   text  — по тексту SlideIR, один раз на колоду.
  #
  # Картиночный проход обязателен и сокращению не подлежит: ТЗ задаёт
  # картинку слайда входом для валидации контента, а текст SlideIR показывает
  # намерение, а не результат. Обрезанный краем слайда текст, наложившиеся
  # блоки, подставленный не тот элемент — всё это в тексте не видно вовсе.
  # Экономим на разрешении и на пропуске неизменённых слайдов, но не на
  # отказе от картинки.
  #
  # По тексту оставлены вопросы, где картинка не добавляет ничего: опечатки,
  # единый язык, происхождение чисел, связность соседних слайдов.
  contextual_checks:
    content.body_matches_title:      image
    content.has_content:             image
    content.visuals_on_topic:        image
    content.no_prompt_leftovers:     image
    content.table_rows_serve_point:  image
    content.title_is_takeaway:       text
    content.one_sentence_summary:    text
    content.figures_in_sources:      text
    content.no_typos:                text
    content.single_language:         text
    content.slides_connected:        text

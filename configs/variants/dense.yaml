# Вариант «плотный»: максимум содержания на слайде, числа — таблицами и фактоидами.
name: dense
description: Много блоков на слайде, мелкая типографика, данные таблицей и числовыми фактоидами.
strategy:
  # Доля слотов паттерна, которую разрешено занять (1.0 = занимать все).
  slot_fill_target: 1.0
  # Предпочтение кегля внутри шкалы шаблона: smaller | mid | larger
  type_scale_bias: smaller
  # Как визуализировать числовые данные: table | chart | factoid | auto
  data_viz_mode: table
  # Сколько смысловых блоков плана класть на один слайд.
  blocks_per_slide: 3
  # Предпочитаемые классы паттернов при прочих равных.
  pattern_preference: [grid, table, kpi_row, two_column]

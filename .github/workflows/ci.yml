name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Те же системные пакеты, что в образе: без них deckwright doctor
      # и часть тестов проверяют не то окружение, в котором сервис работает.
      - name: Системные зависимости
        run: sh scripts/install-system-deps.sh

      - name: Установка
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest -q

      - name: Проверка окружения
        run: deckwright doctor

  e2e:
    name: сквозной прогон
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Системные зависимости
        run: sh scripts/install-system-deps.sh

      - name: Установка
        run: pip install -e ".[dev]"

      # Шаблоны датасета в репозиторий не коммитятся: это чужие материалы на
      # 58 МБ. Прогон идёт на синтетическом шаблоне и на враждебных holdout'ах,
      # которые проверяют, что пайплайн не опирается на особенности присланных
      # трёх. Настоящий чужой шаблон лежит в data/holdout и подхватывается
      # тестами сам.
      - name: Синтетический шаблон
        run: python tests/fixtures/make_template.py ci-templates/synthetic.pptx

      - name: Враждебные holdout-шаблоны
        run: python tests/fixtures/make_holdout.py ci-templates/holdout

      # Модель замокана записанными ответами: без сети, без ключа,
      # результат повторяем от прогона к прогону.
      - name: Сквозной прогон и тесты
        env:
          DECKWRIGHT_TEMPLATES: ci-templates
        run: pytest -q

      - name: Прогон через CLI
        run: |
          deckwright run \
            --template ci-templates/synthetic.pptx \
            --content tests/fixtures/content_pack.json \
            --recorded tests/fixtures/recorded \
            --variant balanced \
            --output ci-out

      - name: Артефакты прогона
        uses: actions/upload-artifact@v4
        with:
          name: deck-${{ github.sha }}
          path: ci-out/
          retention-days: 7

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Образ собирается целиком, включая `RUN deckwright doctor` внутри него.
      # Сборка падает здесь, если в Dockerfile неверно назван системный пакет.
      - name: Сборка образа
        run: docker build -t deckwright:ci .

      # Команда задаётся явно: CMD образа поднимает веб-интерфейс и не
      # завершается, а проверить надо именно окружение внутри образа.
      - name: Запуск проверки окружения в собранном образе
        run: docker run --rm deckwright:ci deckwright doctor

      # Та же команда запуска, что на хостинге: порт из $PORT, проверка
      # здоровья по адресу из railway.json. Контейнер, который собирается,
      # но не отвечает, иначе обнаружился бы только после деплоя.
      - name: Веб-интерфейс отвечает на порту из $PORT
        run: |
          docker run -d --name ui -e PORT=8080 -p 8080:8080 deckwright:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs ui
          exit 1

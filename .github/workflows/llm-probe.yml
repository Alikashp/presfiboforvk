# Живой вызов модели. Запускается вручную и только вручную: ключ платный,
# а на каждом коммите это ни к чему — обычный CI ходит по записанным ответам.
#
# Ключ лежит в секретах репозитория и в логи не попадает: GitHub маскирует
# значения секретов в выводе.
name: LLM probe

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Идентификатор модели"
        required: false
        default: "Qwen/Qwen3.6-27B"
      base_url:
        description: "Базовый URL OpenAI-совместимого endpoint'а"
        required: false
        # У SiliconFlow два независимых сервиса, .com и .cn, с разными
        # аккаунтами и невзаимозаменяемыми ключами. Здесь тот, на котором
        # заведён аккаунт проекта.
        default: "https://api.siliconflow.com/v1"
      price_in:
        description: "Перекрыть цену за 1M входных токенов, USD (пусто = из config.yaml)"
        required: false
        default: ""
      price_out:
        description: "Перекрыть цену за 1M выходных токенов, USD (пусто = из config.yaml)"
        required: false
        default: ""
      repeats:
        description: "Сколько раз подряд прогнать планировщик (разброс важнее одного замера)"
        required: false
        default: "3"
      enable_thinking:
        description: "Включить режим рассуждений (проверить, снимается ли блок <think>)"
        required: false
        default: "false"
      audit:
        description: "Вместо планирования прогнать живой аудит по картинкам слайдов"
        required: false
        default: "false"
      audit_slides:
        description: "Сколько слайдов спросить в аудите (0 — всю колоду)"
        required: false
        default: "4"
      full_run:
        description: "Прогнать всю колоду до .pptx, а не только планирование"
        required: false
        default: "false"
      rewrite:
        description: "Прогнать переписывание текста моделью по находке аудита (главный сценарий демо)"
        required: false
        default: "false"
      rewrite_findings:
        description: "Сколько находок переписать (0 — все)"
        required: false
        default: "1"
      template:
        description: "Шаблон: путь в репозитории или `synthetic` для собираемого на месте"
        required: false
        default: "data/templates/vk_tech.pptx"

jobs:
  probe:
    name: живой вызов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Системные зависимости
        run: sh scripts/install-system-deps.sh

      - name: Установка
        run: pip install -e ".[dev]"

      - name: Режим рассуждений по входным данным запуска
        run: |
          python - <<'PY'
          import os, pathlib, yaml
          path = pathlib.Path("configs/config.yaml")
          cfg = yaml.safe_load(path.read_text(encoding="utf-8"))
          want = os.environ["ENABLE_THINKING"].strip().lower() == "true"
          cfg["llm"]["steps"]["plan_deck"]["enable_thinking"] = want
          path.write_text(yaml.safe_dump(cfg, allow_unicode=True, sort_keys=False), encoding="utf-8")
          print("enable_thinking =", want)
          PY
        env:
          ENABLE_THINKING: ${{ inputs.enable_thinking }}

      # Главный сценарий демонстрации: находка «текст не помещается» → выбор
      # человека → модель переписывает → пересборка → повторный аудит.
      # Механика закрыта тестами на подставной модели; здесь проверяется
      # единственное, чего тестом не проверить: пишет ли настоящая модель
      # текст, проходящий рамки бюджета и запрет на новые числа.
      - name: Живое переписывание текста по находке
        if: ${{ inputs.rewrite == 'true' }}
        env:
          LLM_BASE_URL: ${{ inputs.base_url }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ inputs.model }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Секрет LLM_API_KEY не задан."
            exit 1
          fi
          if [ "${{ inputs.template }}" = "synthetic" ]; then
            python tests/fixtures/make_template.py probe-templates/synthetic.pptx
            TEMPLATE=probe-templates/synthetic.pptx
          else
            TEMPLATE="${{ inputs.template }}"
          fi
          test -f "$TEMPLATE" || { echo "::error::нет шаблона $TEMPLATE"; exit 1; }
          deckwright rewrite-probe \
            --template "$TEMPLATE" \
            --content tests/fixtures/content_pack.json \
            --findings "${{ inputs.rewrite_findings }}" \
            --output probe-out/rewrite

      - name: Живой аудит по картинкам слайдов
        if: ${{ inputs.audit == 'true' && inputs.rewrite != 'true' }}
        env:
          LLM_BASE_URL: ${{ inputs.base_url }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ inputs.model }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Секрет LLM_API_KEY не задан."
            exit 1
          fi
          if [ "${{ inputs.template }}" = "synthetic" ]; then
            python tests/fixtures/make_template.py probe-templates/synthetic.pptx
            TEMPLATE=probe-templates/synthetic.pptx
          else
            TEMPLATE="${{ inputs.template }}"
          fi
          test -f "$TEMPLATE" || { echo "::error::нет шаблона $TEMPLATE"; exit 1; }
          # --spoil обязателен: аудит, который всегда доволен, проходит все
          # тесты и бесполезен. Без заведомо испорченной колоды прогон не
          # отвечает на главный вопрос.
          deckwright audit-probe \
            --template "$TEMPLATE" \
            --content tests/fixtures/content_pack.json \
            --slides "${{ inputs.audit_slides }}" \
            --spoil \
            --output probe-out/audit \
            --save probe-out/audit-probe.json

      - name: Диагностический вызов
        if: ${{ inputs.audit != 'true' && inputs.rewrite != 'true' }}
        env:
          LLM_BASE_URL: ${{ inputs.base_url }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ inputs.model }}
          PRICE_IN: ${{ inputs.price_in }}
          PRICE_OUT: ${{ inputs.price_out }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Секрет LLM_API_KEY не задан. Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          ARGS=""
          if [ -n "$PRICE_IN" ] && [ -n "$PRICE_OUT" ]; then
            ARGS="--price-in $PRICE_IN --price-out $PRICE_OUT"
          fi
          # Шаблон обязателен: без него в промпт не уйдут ограничения
          # длины, и проба проверит не тот промпт, который работает в
          # настоящем прогоне.
          if [ "${{ inputs.template }}" = "synthetic" ]; then
            python tests/fixtures/make_template.py probe-templates/synthetic.pptx
            TEMPLATE=probe-templates/synthetic.pptx
          else
            TEMPLATE="${{ inputs.template }}"
          fi
          test -f "$TEMPLATE" || { echo "::error::нет шаблона $TEMPLATE"; exit 1; }
          deckwright probe \
            --content tests/fixtures/content_pack.json \
            --template "$TEMPLATE" \
            --repeats "${{ inputs.repeats }}" \
            --save probe-out/plan_deck.json \
            $ARGS

      # Артефакт лежит на хранилище, куда закрыт доступ из среды разработки,
      # поэтому полученный план дублируется в лог: оттуда его можно взять как
      # настоящую фикстуру вместо рукописной.
      - name: Полученный план целиком
        if: ${{ always() && inputs.audit != 'true' && inputs.rewrite != 'true' }}
        run: |
          if [ -f probe-out/plan_deck.json ]; then
            echo "----- НАЧАЛО plan_deck.json -----"
            cat probe-out/plan_deck.json
            echo "----- КОНЕЦ plan_deck.json -----"
          else
            echo "плана нет: диагностический вызов не дошёл до сохранения"
          fi

      - name: Сквозной прогон на живой модели
        if: ${{ inputs.full_run == 'true' && inputs.rewrite != 'true' }}
        env:
          LLM_BASE_URL: ${{ inputs.base_url }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ inputs.model }}
        run: |
          if [ "${{ inputs.template }}" = "synthetic" ]; then
            python tests/fixtures/make_template.py probe-templates/synthetic.pptx
            TEMPLATE=probe-templates/synthetic.pptx
          else
            TEMPLATE="${{ inputs.template }}"
          fi
          test -f "$TEMPLATE" || { echo "::error::нет шаблона $TEMPLATE"; exit 1; }
          deckwright run \
            --template "$TEMPLATE" \
            --content tests/fixtures/content_pack.json \
            --variant balanced \
            --output probe-out/deck

      - name: Результаты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-probe-${{ github.run_number }}
          path: probe-out/
          retention-days: 14
          # Диагностический прогон может упасть до записи результатов — например,
          # если endpoint не принял ключ. Это не повод помечать шаг проблемным:
          # сам отчёт уже в логе.
          if-no-files-found: ignore
